<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutracker Web UI</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Rutracker Search</h1>
            <div class="status" id="status">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">Checking status...</span>
            </div>
        </header>

        <div class="search-section">
            <form id="searchForm">
                <div class="form-group">
                    <label for="title">Title *</label>
                    <input 
                        type="text" 
                        id="title" 
                        name="title" 
                        placeholder="e.g., Титаник, Titanic" 
                        required
                    >
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="year">Year (optional)</label>
                        <input 
                            type="text" 
                            id="year" 
                            name="year" 
                            placeholder="e.g., 2023"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="season">Season (optional)</label>
                        <input 
                            type="text" 
                            id="season" 
                            name="season" 
                            placeholder="e.g., 1, 2"
                        >
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="searchBtn">
                    <span id="searchBtnText">Search</span>
                    <span id="searchBtnLoader" class="loader" style="display: none;"></span>
                </button>
            </form>
        </div>

        <div id="searchHistory" class="search-history" style="display: none;">
            <!-- Populated by JavaScript -->
        </div>

        <div class="filters-section">
            <button class="filter-toggle-btn" id="hdFilterBtn" onclick="toggleHDFilter()">
                <span class="filter-icon" id="hdFilterIcon">🎬</span>
                <span id="hdFilterText">All Quality</span>
            </button>
        </div>

        <div id="resultsSection" class="results-section" style="display: none;">
            <div class="results-header">
                <h2>Search Results</h2>
                <div class="results-count" id="resultsCount"></div>
            </div>
            
            <div class="table-container">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="name">Name</th>
                            <th class="sortable" data-sort="size">Size (MB)</th>
                            <th class="sortable" data-sort="seeders">Seeders</th>
                            <th class="sortable" data-sort="leechers">Leechers</th>
                            <th>Forum</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <!-- Results will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>

        <div id="emptyState" class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <p>Enter a search query to find torrents</p>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Torrent Details</h2>
                <button class="modal-close" onclick="closeDetailsModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="loader"></div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
